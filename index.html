<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Outubro Rosa - saúde das mamas e prevenção do câncer do colo do útero.">
<title>Outubro Rosa • Informação também é cuidado</title>
<style>
:root{--p:#e83f83;--pd:#a51f58;--pl:#ffedf5;--p2:#f8a1c2;--ink:#3f2431;--mut:#765b68;--line:#f0cbdc;--bg:#fff8fb}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 15% 0,#ffe6f1 0,transparent 28%),linear-gradient(180deg,var(--bg),#fff);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}.wrap{width:min(960px,calc(100% - 26px));margin:auto}.hero{position:relative;overflow:hidden;margin:20px 0;padding:42px 20px;text-align:center;border:1px solid var(--line);border-radius:32px;background:linear-gradient(135deg,#fff,#ffe1ed);box-shadow:0 14px 40px #b72e6412}.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:#f36d9e22}.hero:before{width:180px;height:180px;left:-90px;top:-80px}.hero:after{width:220px;height:220px;right:-100px;bottom:-130px}.ribbon{font-size:68px;animation:float 3s ease-in-out infinite}.hero h1{position:relative;margin:8px 0;font-size:clamp(34px,8vw,58px);letter-spacing:-2px}.hero p{position:relative;max-width:650px;margin:auto;color:var(--mut);line-height:1.6;font-size:17px}.cta{margin-top:20px;border:0;border-radius:999px;padding:14px 22px;background:var(--p);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 8px 22px #e83f8330}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid var(--line);background:#fff;border-radius:22px;padding:19px;text-align:left;min-height:145px;cursor:pointer;transition:.2s;box-shadow:0 8px 25px #8e315d0a}.card:hover{transform:translateY(-4px);border-color:#dc7da3}.card:active{transform:scale(.98)}.icon{font-size:30px}.card h2{font-size:18px;margin:9px 0 5px}.card p{margin:0;color:var(--mut);font-size:14px;line-height:1.4}.section{display:none;margin:16px 0;padding:25px;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 30px #8e315d0b;animation:up .35s ease}.section.show{display:block}.tag{display:inline-block;background:var(--pl);color:var(--pd);padding:6px 10px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.6px}.section h2{font-size:28px;margin:10px 0}.section p,.section li{line-height:1.65}.note{padding:16px;border-radius:17px;background:linear-gradient(135deg,#fff1f7,#fff);border:1px solid var(--line);margin-top:16px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:18px}.step{padding:13px;border-radius:15px;background:var(--pl);text-align:center;font-size:13px;font-weight:700}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.primary,.secondary{border-radius:13px;padding:12px 17px;cursor:pointer}.primary{border:0;background:var(--p);color:#fff;font-weight:800}.secondary{border:1px solid var(--line);background:#fff}.quiz .answers{display:grid;gap:10px;margin-top:16px}.answer{border:1px solid var(--line);background:#fff;border-radius:15px;padding:15px;text-align:left;cursor:pointer}.answer.correct{background:#effaf3;border-color:#88c59d}.answer.wrong{background:#fff0f2;border-color:#df9cac}.progress{height:8px;background:#f8dce8;border-radius:99px;overflow:hidden;margin:10px 0 18px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--p),#ff8eb8);transition:.3s}.result{text-align:center;padding:10px}.big{font-size:48px}.footer{text-align:center;color:var(--mut);font-size:12px;line-height:1.5;padding:18px 0 30px}@keyframes float{50%{transform:translateY(-7px)}}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:720px){.nav{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr 1fr}}@media(max-width:450px){.nav{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.hero{padding:34px 16px}}@media(prefers-reduced-motion:reduce){*,html{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero">
<div class="ribbon">🎀</div>
<h1>Outubro Rosa</h1>
<p><strong>Informação também é cuidado.</strong><br>Conheça seu corpo, entenda seus exames e saiba quando procurar a unidade de saúde.</p>
<button class="cta" id="start">Começar a jornada 🌷</button>
</section>

<section class="nav" id="menu">
<button class="card" data-topic="mamas"><span class="icon">🌸</span><h2>Mamas</h2><p>Sinais de alerta e mamografia.</p></button>
<button class="card" data-topic="preventivo"><span class="icon">🩺</span><h2>Preventivo</h2><p>Conheça o rastreamento do colo do útero.</p></button>
<button class="card" data-topic="preparo"><span class="icon">📋</span><h2>Antes do exame</h2><p>Veja como se preparar para a coleta.</p></button>
<button class="card" data-topic="situacoes"><span class="icon">💗</span><h2>O que eu faço?</h2><p>Escolha uma situação e veja a orientação.</p></button>
<button class="card" data-topic="quiz"><span class="icon">🧠</span><h2>Quiz</h2><p>Teste seus conhecimentos.</p></button>
</section>

<section class="section" id="content" aria-live="polite"></section>
<section class="section" id="quiz" aria-live="polite"></section>

<footer class="footer">Conteúdo educativo. Procure sua unidade de saúde para avaliação e orientação individual. Recomendações podem ser atualizadas pelos órgãos de saúde.</footer>
</main>

<script>
const content=document.getElementById('content'),quiz=document.getElementById('quiz');
const topics={
mamas:{tag:'SAÚDE DAS MAMAS',title:'Conheça suas mamas',body:`<p>Conhecer o próprio corpo ajuda a perceber alterações novas ou persistentes.</p><ul><li>Caroço ou nódulo novo.</li><li>Mudança na pele ou no formato da mama.</li><li>Alteração ou retração do mamilo.</li><li>Secreção sanguinolenta pelo mamilo.</li></ul><p>Uma alteração não significa necessariamente câncer, mas deve ser avaliada por um profissional.</p><div class="note"><b>Mamografia no SUS:</b> para rastreamento populacional, a recomendação é para mulheres de <b>50 a 74 anos, a cada dois anos</b>.</div>`},
preventivo:{tag:'COLO DO ÚTERO',title:'Preventivo: um cuidado que merece atenção',body:`<p>O rastreamento do câncer do colo do útero é destinado a pessoas com colo do útero de <b>25 a 64 anos que já tiveram atividade sexual</b>.</p><p>O Brasil está implantando o teste molecular de <b>DNA-HPV</b> como exame primário de rastreamento. Onde ele ainda não estiver disponível, o <b>exame citopatológico (Papanicolau)</b> continua sendo utilizado.</p><div class="steps"><div class="step">1️⃣ Coleta</div><div class="step">2️⃣ Análise</div><div class="step">3️⃣ Resultado</div><div class="step">4️⃣ Acompanhamento</div></div><div class="note"><b>Importante:</b> um resultado alterado não significa automaticamente câncer. Pode ser necessário repetir o exame ou realizar acompanhamento.</div>`},
preparo:{tag:'PREPARAÇÃO',title:'Antes do preventivo',body:`<p>Quando possível, para aumentar a chance de uma coleta adequada:</p><ul><li>Evite relações sexuais nas 48 horas anteriores.</li><li>Evite medicamentos vaginais, espermicidas e lubrificantes nas 48 horas anteriores.</li><li>Evite exames intravaginais nesse período.</li><li>Preferencialmente, faça a coleta após cinco dias do término da menstruação.</li></ul><div class="note">Após a coleta, <b>retorne para saber o resultado</b> e receber a orientação da equipe.</div>`}
};
const situations=[
['🔴 Percebi um caroço na mama.','Procure uma unidade de saúde para avaliação. Uma alteração nova ou persistente merece atenção, mesmo que não exista dor.'],
['🩺 Estou na idade de fazer o preventivo.','Procure sua unidade de saúde para verificar qual método de rastreamento está disponível e realizar o acompanhamento indicado.'],
['📄 Meu exame veio alterado.','Resultado alterado não significa automaticamente câncer. É importante seguir a orientação da equipe e não abandonar o acompanhamento.'],
['💬 Estou com dúvida sobre o exame.','A equipe da unidade de saúde pode explicar o procedimento, o preparo e o acompanhamento de acordo com sua situação.']
];
function show(title,tag,body){quiz.classList.remove('show');content.innerHTML=`<span class="tag">${tag}</span><h2>${title}</h2>${body}<div class="actions"><button class="secondary" id="close">Fechar</button></div>`;content.classList.add('show');document.getElementById('close').onclick=()=>content.classList.remove('show');content.scrollIntoView({behavior:'smooth',block:'nearest'})}
function showSituation(){show('O que eu faço?','SITUAÇÕES DO DIA A DIA','<p>Escolha uma situação:</p>'+situations.map((s,i)=>`<button class="answer" data-s="${i}"><b>${s[0]}</b></button>`).join(''));content.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const s=situations[+b.dataset.s];show(s[0],'ORIENTAÇÃO',`<p>${s[1]}</p>`)});}
document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{let k=b.dataset.topic;if(k==='quiz')startQuiz();else if(k==='situacoes')showSituation();else{const t=topics[k];show(t.title,t.tag,t.body)}})
document.getElementById('start').onclick=()=>document.getElementById('menu').scrollIntoView({behavior:'smooth'});

const qs=[
['O preventivo ajuda no rastreamento do câncer do colo do útero.','Verdadeiro','O rastreamento busca identificar alterações que podem ser acompanhadas e tratadas.'],
['A mamografia de rastreamento no SUS é indicada para toda mulher a partir dos 30 anos.','Falso','Para rastreamento populacional, a recomendação é de 50 a 74 anos, a cada dois anos.'],
['Homens também podem desenvolver câncer de mama.','Verdadeiro','É muito menos frequente, mas homens também podem desenvolver câncer de mama.'],
['O Papanicolau continua sendo usado onde o teste DNA-HPV ainda não está disponível.','Verdadeiro','O citopatológico continua sendo utilizado nos locais onde o teste molecular ainda não foi implantado.'],
['Um resultado alterado no preventivo significa automaticamente câncer.','Falso','Resultado alterado pode exigir investigação ou acompanhamento, mas não significa automaticamente câncer.']
];
let qi=0,score=0,answered=false;
function startQuiz(){content.classList.remove('show');quiz.classList.add('show');qi=0;score=0;renderQ();quiz.scrollIntoView({behavior:'smooth',block:'nearest'})}
function renderQ(){answered=false;const q=qs[qi],pct=(qi/qs.length)*100;quiz.innerHTML=`<span class="tag">QUIZ • ${qi+1}/${qs.length}</span><div class="progress"><i style="width:${pct}%"></i></div><h2>${q[0]}</h2><div class="answers"><button class="answer" data-a="Verdadeiro">✅ Verdadeiro</button><button class="answer" data-a="Falso">❌ Falso</button></div>`;quiz.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(b.dataset.a))}
function answer(v){if(answered)return;answered=true;const q=qs[qi],ok=v===q[1];if(ok)score++;quiz.querySelectorAll('.answer').forEach(b=>{if(b.dataset.a===q[1])b.classList.add('correct');else if(b.dataset.a===v)b.classList.add('wrong')});quiz.insertAdjacentHTML('beforeend',`<div class="note"><b>${ok?'🎉 Acertou!':'📚 Vamos corrigir.'}</b><p>${q[2]}</p><button class="primary" id="next">${qi===qs.length-1?'Ver resultado':'Próxima'}</button></div>`);document.getElementById('next').onclick=()=>qi<qs.length-1?(qi++,renderQ()):finish()}
function finish(){quiz.innerHTML=`<div class="result"><div class="big">🎀</div><span class="tag">RESULTADO</span><h2>Você terminou!</h2><p>Você acertou <b>${score} de ${qs.length}</b>.</p><p>Mais importante que a pontuação é saber onde buscar informação e manter o acompanhamento de saúde em dia.</p><button class="primary" id="again">Refazer quiz</button></div>`;document.getElementById('again').onclick=startQuiz}
</script>
</body>
</html>
